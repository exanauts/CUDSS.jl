name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  test-gpu:
    runs-on: [self-hosted, Linux, X64, gpu, cuda]
    strategy:
      matrix:
        julia-version: ['1.10', '1.11', '1.12']
        cuda-version: ['12.9', '13.2']
        julia-arch: [x64]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          token: ${{ github.token }}
          ssh-strict: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Configure test project
        run: |
          julia --project=./test -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
            using CUDA
            CUDA.set_runtime_version!(v"${{ matrix.cuda-version }}")'
      - name: Reinstantiate with selected CUDA runtime
        run: julia --project=./test -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: |
          unset JULIA_CUDSS_LIBRARY_PATH
          julia --project=./test --code-coverage=user --color=yes -e 'include("test/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
