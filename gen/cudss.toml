[general]
library_name = "libcudss"
output_file_path = "../src/libcudss.jl"
prologue_file_path = "./libcudss_prologue.jl"

output_ignorelist = [
    "CUDSS_ALLOCATOR_NAME_LEN",
    "CUDSS_VERSION",
    "CUDSS_VERSION_MAJOR",
    "CUDSS_VERSION_MINOR",
    "CUDSS_VERSION_PATCH",
    # cuDSS 1.0: cudssDataType_t became a deprecated alias of cudaDataType_t, and these
    # are #defines onto CUDA_* enumerators or casts of out-of-range values (62, 63).
    # CUDACore's Base.@enum cudaDataType has neither the CUDA_-prefixed names nor those
    # values, so emitting them would fail at load time.
    "CUDSS_DATA_TYPE_UNSET",
    "CUDSS_R_32F",
    "CUDSS_R_64F",
    "CUDSS_C_32F",
    "CUDSS_C_64F",
    "CUDSS_R_64F_MP2",
    "CUDSS_R_64F_64F",
    "CUDSS_R_32I",
    "CUDSS_R_64I",
    "CUDSS_DATA_TYPE_DEPRECATED_PREFIX",
    "CUDSS_DATA_TYPE_DEPRECATED_SUFFIX"
]

[codegen]
use_ccall_macro = true
always_NUL_terminated_string = true

[api]
checked_rettypes = [ "cudssStatus_t" ]

[api.cudssGetVersion]
needs_context = false

[api.cudssGetProperty]
needs_context = false

[api.cudssDataSet.argtypes]
4 = "PtrOrCuPtr{Cvoid}"

[api.cudssDataGet.argtypes]
4 = "PtrOrCuPtr{Cvoid}"

[api.cudssMatrixCreateDn.argtypes]
5 = "CuPtr{Cvoid}"

[api.cudssMatrixCreateBatchDn.argtypes]
6 = "CuPtr{Ptr{Cvoid}}"

[api.cudssMatrixCreateCsr.argtypes]
5 = "CuPtr{Cvoid}"
6 = "CuPtr{Cvoid}"
7 = "CuPtr{Cvoid}"
8 = "CuPtr{Cvoid}"

[api.cudssMatrixCreateBatchCsr.argtypes]
6 = "CuPtr{Ptr{Cvoid}}"
7 = "CuPtr{Ptr{Cvoid}}"
8 = "CuPtr{Ptr{Cvoid}}"
9 = "CuPtr{Ptr{Cvoid}}"

[api.cudssMatrixGetDn.argtypes]
5 = "Ptr{CuPtr{Cvoid}}"

[api.cudssMatrixGetBatchDn.argtypes]
6 = "Ptr{CuPtr{Ptr{Cvoid}}}"

[api.cudssMatrixGetCsr.argtypes]
5 = "Ptr{CuPtr{Cvoid}}"
6 = "Ptr{CuPtr{Cvoid}}"
7 = "Ptr{CuPtr{Cvoid}}"
8 = "Ptr{CuPtr{Cvoid}}"

[api.cudssMatrixGetBatchCsr.argtypes]
6 = "Ptr{CuPtr{Ptr{Cvoid}}}"
7 = "Ptr{CuPtr{Ptr{Cvoid}}}"
8 = "Ptr{CuPtr{Ptr{Cvoid}}}"
9 = "Ptr{CuPtr{Ptr{Cvoid}}}"

[api.cudssMatrixSetValues.argtypes]
2 = "CuPtr{Cvoid}"

[api.cudssMatrixSetBatchValues.argtypes]
2 = "CuPtr{Ptr{Cvoid}}"

[api.cudssMatrixSetCsrPointers.argtypes]
2 = "CuPtr{Cvoid}"
3 = "CuPtr{Cvoid}"
4 = "CuPtr{Cvoid}"
5 = "CuPtr{Cvoid}"

[api.cudssMatrixSetBatchCsrPointers.argtypes]
2 = "CuPtr{Ptr{Cvoid}}"
3 = "CuPtr{Ptr{Cvoid}}"
4 = "CuPtr{Ptr{Cvoid}}"
5 = "CuPtr{Ptr{Cvoid}}"
